services:
  postgres:
    image: postgres:16-alpine
    container_name: financas-postgres
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
    ports:
      - "5432:5432"
    volumes:
      - financas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  financas-postgres-data:
